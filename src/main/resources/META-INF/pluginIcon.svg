<!--
  PHP Magic Method Navigation - Marketplace plugin icon (40px), light-theme variant.
  Dark twin in pluginIcon_dark.svg. Visual language: a "go to declaration" jump - a blue arc
  that springs up from an invisible magic call site and lands (arrowhead) on the method that
  actually runs. The gray double bar underneath is the `__` double-underscore motif every PHP
  dev reads as "magic method"; the blue sparkle is the "magic" (the implicit, unspelled call).
  Family resemblance to the same vendor's other plugins: plate-less, structural gray #6E7681,
  rounded ~2.6 stroke, a single saturated accent - here JetBrains blue #3574F0 (same blue as the
  in-editor gutter icon icons/magicNav.svg) rather than teal/fire.
-->
<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- the jump: an arc springing off the magic site, arrowhead landing on the real method -->
  <path d="M8 29 C 7 14, 24 9, 30 17" stroke="#3574F0" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M29.4 12 L 30 17 L 25.4 15" stroke="#3574F0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the "magic": a sparkle over the arc's apex -->
  <path d="M22 4 L 22.7 6.3 L 25 7 L 22.7 7.7 L 22 10 L 21.3 7.7 L 19 7 L 21.3 6.3 Z" fill="#3574F0"/>
  <!-- the `__` double-underscore motif: two rounded bars, the magic-method naming convention -->
  <path d="M8 33 H 17" stroke="#6E7681" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M21 33 H 30" stroke="#6E7681" stroke-width="2.6" stroke-linecap="round"/>
</svg>
