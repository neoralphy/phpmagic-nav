# Keep this MINIMAL. First attempt (2026-07-09) also set jb.consents.confirmation.enabled=false
# and idea.initially.ask.config=never — that suppressed PhpStorm's license/consent UI entirely:
# the IDE looped "awaiting LicensingFacade.getInstance()" forever with NO window (headless
# deadlock, log silent after ~4 min). Commercial IDEs must be allowed to show that flow once.
idea.trust.all.projects=true
# Tips suppression does NOT work from here: the Gradle IntelliJ plugin passes
# -Dide.show.tips.on.startup.default.value=true on the command line, which wins. The switch
# that works is persistent config — GeneralSettings/showTipsOnStartup=false in
# config_runPhpStorm/options/ide.general.xml (see README "Sandbox de-noising").
